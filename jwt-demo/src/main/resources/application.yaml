springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha


jwt:
  secret: your_super_secret_key_that_is_at_least_32_characters_long_12345
  expiration: 3600000