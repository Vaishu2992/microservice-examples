spring:
  security:
  #    user:
  #      name: test
  #      password: test123
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: jwt-demo
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/employee_db
    username: root
    password: root@123
  jpa:
    database: mysql
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
  data:
    jpa:
      repositories:
        enabled: true

server:
  port: 9000
#  ssl:
